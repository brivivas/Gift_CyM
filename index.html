
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Su historia ❤️</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #171411;
      font-family: Arial, sans-serif;
      color: white;
    }

    #panel {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #171411;
    }

    h2 {
      font-size: 27px;
      margin: 0 0 15px;
    }

    #intro {
      font-size: 17px;
      line-height: 1.5;
      margin: 8px 0 20px;
    }

    #status {
      font-size: 17px;
      line-height: 1.5;
      margin: 15px auto;
      max-width: 450px;
    }

    #personalMessage {
      display: none;
      font-size: 16px;
      line-height: 1.6;
      max-width: 460px;
      margin: 12px auto;
      background: rgba(23, 20, 17, 0.85);
      padding: 15px;
      border-radius: 15px;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 14px 25px;
      margin: 8px;
      background: #d9b77e;
      color: #241b12;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #soundButton {
      display: none;
    }

    #ar-scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Después de iniciar, el panel deja ver la cámara */
    #panel.ar-active {
      background: transparent;
      pointer-events: none;
    }

    #panel.ar-active h2,
    #panel.ar-active #intro {
      display: none;
    }

    #panel.ar-active #soundButton {
      pointer-events: auto;
    }

    .a-enter-vr {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="panel">

    <h2>Su historia ❤️</h2>

    <div id="intro">
      Una sorpresa especial para ti.<br>
      ¡Sube el volumen! 🔊
    </div>

    <button id="startButton">
      Iniciar experiencia
    </button>

    <div id="status">
      Enfoca la ilustración de la invitación.
    </div>

    <div id="personalMessage">
      <strong>¡Tu sorpresa está aquí! ❤️</strong>
      <br><br>
      Esta canción me recuerda a ambos, del día de su boda cuando le bailaste esta canción a Chris.
    </div>

    <button id="soundButton">
      Activar sonido 🔊
    </button>

  </div>

  <a-scene
    id="ar-scene"
    mindar-image="
      imageTargetSrc: ./marcador.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="videoAsset"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#videoAsset"
        width="1"
        height="0.5625"
        position="0 0 0.02">
      </a-video>

    </a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>

  <script>
    const scene = document.querySelector("#ar-scene");
    const video = document.querySelector("#videoAsset");

    const panel = document.querySelector("#panel");
    const startButton = document.querySelector("#startButton");
    const soundButton = document.querySelector("#soundButton");
    const status = document.querySelector("#status");
    const intro = document.querySelector("#intro");
    const personalMessage =
      document.querySelector("#personalMessage");

    const target = document.querySelector("#target");

    let started = false;
    let visible = false;

    // Iniciar cámara y experiencia
    startButton.addEventListener("click", async () => {

      if (started) return;

      try {
        status.textContent = "Preparando la sorpresa...";

        video.muted = false;
        video.volume = 1;

        await scene.systems["mindar-image-system"].start();

        started = true;

        startButton.style.display = "none";
        intro.style.display = "none";

        // Mostrar la cámara sin el fondo oscuro del panel
        panel.classList.add("ar-active");

        status.textContent =
          "Ahora enfoca la ilustración de tu invitación ❤️";

      } catch (error) {

        console.error("Error al iniciar MindAR:", error);

        status.textContent =
          "No se pudo activar la cámara. Revisa los permisos.";

      }
    });

    // Cuando reconoce la ilustración
    target.addEventListener("targetFound", async () => {

      visible = true;

      status.textContent = "";
      personalMessage.style.display = "block";

      try {
        video.muted = false;
        video.volume = 1;

        await video.play();

        soundButton.style.display = "none";

      } catch (error) {

        console.error("El navegador bloqueó el sonido:", error);

        soundButton.style.display = "inline-block";

        status.textContent =
          "Toca el botón para escuchar la canción.";

      }

    });

    // Cuando deja de reconocer la ilustración
    target.addEventListener("targetLost", () => {

      visible = false;

      video.pause();

      personalMessage.style.display = "none";

      status.textContent =
        "Vuelve a enfocar la ilustración ❤️";

      soundButton.style.display = "none";

    });

    // Activar sonido manualmente si es necesario
    soundButton.addEventListener("click", async () => {

      video.muted = false;
      video.volume = 1;

      try {
        if (visible) {
          await video.play();
        }

        soundButton.style.display = "none";

      } catch (error) {

        console.error(error);

        status.textContent =
          "No se pudo activar el sonido. Inténtalo nuevamente.";

      }

    });

    scene.addEventListener("loaded", () => {
      console.log("Experiencia WebAR cargada");
    });

  </script>

</body>
</html>
